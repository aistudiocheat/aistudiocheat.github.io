name: Agen AI Penulis Artikel (2x Sehari)

on:
  schedule:
    # Berjalan otomatis 2x sehari: Jam 07:00 WIB (00:00 UTC) dan Jam 19:00 WIB (12:00 UTC)
    - cron: '37 0,12 * * *' 
  workflow_dispatch: # Tombol rahasia agar Anda bisa tes jalankan manual kapan saja

# Memberikan izin penuh kepada robot GitHub untuk menulis file ke dalam repositori
permissions:
  contents: write

jobs:
  tulis-dan-publish:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Ambil Kode Repositori
      uses: actions/checkout@v4

    - name: 2. Setup Python di Server
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Install SDK Resmi Google AI
      run: |
        pip install google-genai

    - name: 4. Jalankan Agen AI (Bikin Artikel Markdown)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python generate_post.py

    - name: 5. Push Artikel Baru ke Folder Posts
      run: |
        git config --global user.name "Agen AI Fastwork Lead"
        git config --global user.email "ai-agent-automation@github.com"

        # BERUBAH DI SINI: Menyuruh Git mendeteksi file posts DAN sitemap.xml sekaligus
        git add posts/ sitemap.xml

        # Lakukan commit jika ada file baru, lalu lakukan push aman ke branch aktif saat ini
        if ! git diff-index --quiet HEAD; then
          git commit -m "Automated: Artikel baru dan update sitemap.xml dari Gemini"
          git push origin HEAD:${{ github.ref_name }}
        else
          echo "Tidak ada perubahan artikel baru."
        fi

